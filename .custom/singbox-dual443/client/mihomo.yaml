# 源自 config/mihomo/config/mihomo.yaml，保留其 DNS、分流及规则集。
# 删除机场订阅和空地区组；通用 TUN 已启用。Clash Verge Rev 可通过 GUI 开关覆写 tun.enable。
# 凭据字段与 .custom/singbox-dual443/server.json 一致；勿公开发布填入真实凭据的配置。
proxies:
  - name: 自建-Reality
    type: vless
    server: REPLACE_WITH_NODE_ADDRESS
    port: 443
    uuid: REPLACE_WITH_UUID
    udp: true
    tls: true
    network: tcp
    flow: xtls-rprx-vision
    servername: www.cloudflare.com
    client-fingerprint: chrome
    reality-opts:
      public-key: REPLACE_WITH_REALITY_PUBLIC_KEY
      short-id: '01234567'
    smux:
      enabled: true
      padding: true
  - name: 自建-Hy2
    type: hysteria2
    server: REPLACE_WITH_NODE_ADDRESS
    port: 443
    password: REPLACE_WITH_HYSTERIA2_PASSWORD
    sni: REPLACE_WITH_HY2_SNI
    skip-cert-verify: false
  - name: 直连
    type: direct
    udp: true
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 127.0.0.1:9090
secret: REPLACE_WITH_API_SECRET
ntp:
  enable: true
  write-to-system: false
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    rule-set:cn_domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain:
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    rule-set:fakeipfilter_!cn:
      - https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true
  nameserver:
    - https://8.8.8.8/dns-query#默认代理&ecs=223.5.5.0/24
  fallback:
    - https://8.8.8.8/dns-query#默认代理
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:cn_domain
    - rule-set:microsoftcn_domain
    - rule-set:applecn_domain
    - rule-set:steamcn_domain
proxy-groups:
  - name: 默认代理
    type: select
    proxies:
      - 自建-Reality
      - 自建-Hy2
      - 全部自动
      - 直连
