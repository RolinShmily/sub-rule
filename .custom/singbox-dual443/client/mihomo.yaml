      - 直连
  - name: 漏网之鱼
    type: select
    proxies:
      - 默认代理
      - 自建-Reality
      - 自建-Hy2
      - 全部自动
      - 直连
  - name: 全部手动
    type: select
    proxies:
      - 自建-Reality
      - 自建-Hy2
      - 直连
  - name: 全部自动
    type: url-test
    proxies:
      - 自建-Reality
      - 自建-Hy2
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    tolerance: 50
  - name: GLOBAL
    type: select
    proxies:
      - 默认代理
      - 自建-Reality
      - 自建-Hy2
      - 全部自动
      - 直连
      - AI
      - YouTube
      - Google
      - GitHub
      - Telegram
      - TikTok
      - NETFLIX
      - Wallet
      - Steam
      - Microsoft
      - OneDrive
      - Apple
      - 漏网之鱼
