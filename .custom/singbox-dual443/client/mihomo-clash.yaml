# ==============================================================================
# 通用双栈客户端 Mihomo 配置文件 (sing-box 1.14 / Mihomo 对齐版)
#
# 核心特性：
# 1. 结构极简：对齐 linux_mini 极简结构，仅保留单一「Proxy」选择组（Reality / Hysteria2 / Direct）；
# 2. 应急直连：Proxy 策略组内置 Direct，两节点同时故障时在面板一键切换直连，无需修改配置；
# 3. 局域网独立：allow-lan 为 false，仅监听本机 127.0.0.1:7890 与 9090；
# 4. Web Dashboard：预置 metacubexd 面板（ui 目录），支持通过 RuleSetProxy 镜像加速下载；
# 5. Tailscale / Headscale 穿透：放行 STUN/WireGuard 端口（3478, 41641），排除标准内网网段；
# 6. 国内镜像直连：gh-proxy 强制走 Direct 出站与国内 DoH 解析，杜绝冷启动拉取规则集死锁。
#
# 凭据字段由 Update-SingboxDual443.sh / .ps1 自动识别并批量替换；切勿公开发布含真实凭据的文件。
# ==============================================================================

# ==============================================================================
# 1. 代理节点配置 (Proxies)
# ==============================================================================
proxies:
  - name: Reality
    type: vless
    server: REPLACE_WITH_NODE_ADDRESS
    port: 443
    uuid: REPLACE_WITH_UUID
    udp: true
    tls: true
    network: tcp
    flow: xtls-rprx-vision
    servername: www.cloudflare.com
    client-fingerprint: chrome
    reality-opts:
      public-key: REPLACE_WITH_REALITY_PUBLIC_KEY
      short-id: REPLACE_WITH_REALITY_SHORT_ID
    # 注意：使用 xtls-rprx-vision 流控时严禁开启 smux 多路复用，否则会破坏 TLS 记录层填充导致协议断流
    smux:
      enabled: false

  - name: Hysteria2
    type: hysteria2
    server: REPLACE_WITH_NODE_ADDRESS
    port: 443
    password: REPLACE_WITH_HYSTERIA2_PASSWORD
    sni: REPLACE_WITH_HY2_SNI
    skip-cert-verify: false

  - name: CF-CDN
    type: vless
    server: REPLACE_WITH_CF_OPTIMIZED_DOMAIN
    port: 8443
    uuid: REPLACE_WITH_WS_UUID
    udp: true
    tls: true
    network: ws
    servername: REPLACE_WITH_WS_SNI
    client-fingerprint: chrome
    ws-opts:
      path: REPLACE_WITH_WS_PATH
      headers:
        Host: REPLACE_WITH_WS_SNI
      max-early-data: 2048
      early-data-header-name: Sec-WebSocket-Protocol

  - name: Direct
    type: direct
    udp: true

# ==============================================================================
# 2. 基础与网络设置 (General Settings)
# ==============================================================================
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

ntp:
  enable: true
  write-to-system: false

# ==============================================================================
# 3. 外部控制与 Web 管理面板 (External Controller & Web UI)
# ==============================================================================
external-controller: 127.0.0.1:9090
secret: REPLACE_WITH_API_SECRET
external-ui: ui
external-ui-name: metacubexd
external-ui-url: "https://gh-proxy.com/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# ==============================================================================
# 4. TUN 虚拟网卡设置 (TUN Settings)
# ==============================================================================
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  route-exclude-address:
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48

# ==============================================================================
# 5. 域名嗅探与协议识别 (Sniffer)
# ==============================================================================
sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com

# ==============================================================================
# 6. DNS 模块与分流策略 (DNS Settings)
# ==============================================================================
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    'REPLACE_WITH_HEADSCALE_SERVER':
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    '+.REPLACE_WITH_HEADSCALE_BASE_DOMAIN':
      - 100.100.100.100
    'gh-proxy.com,+.gh-proxy.com':
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    rule-set:cn_domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain:
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    rule-set:fakeipfilter_!cn:
      - https://8.8.8.8/dns-query#Proxy&disable-qtype-65=true
  nameserver:
    - https://8.8.8.8/dns-query#Proxy&ecs=223.5.5.0/24
  fallback:
    - https://8.8.8.8/dns-query#Proxy
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - 'REPLACE_WITH_HEADSCALE_SERVER'
    - '+.REPLACE_WITH_HEADSCALE_SERVER'
    - '+.REPLACE_WITH_HEADSCALE_BASE_DOMAIN'
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:cn_domain
    - rule-set:microsoftcn_domain
    - rule-set:applecn_domain
    - rule-set:steamcn_domain

# ==============================================================================
# 7. 策略组配置 (Proxy Groups)
# ==============================================================================
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Reality
      - Hysteria2
      - CF-CDN
      - Direct

# ==============================================================================
# 8. 分流规则 (Routing Rules)
# ==============================================================================
rules:
  # --- 自建组网直连 (Headscale / Tailscale) ---
  - PROCESS-NAME,tailscaled.exe,Direct
  - DOMAIN-SUFFIX,REPLACE_WITH_HEADSCALE_SERVER,Direct
  - DOMAIN-SUFFIX,REPLACE_WITH_HEADSCALE_BASE_DOMAIN,Direct
  - IP-CIDR,100.64.0.0/10,Direct,no-resolve
  - IP-CIDR6,fd7a:115c:a1e0::/48,Direct,no-resolve
  - DST-PORT,3478,Direct,no-resolve
  - DST-PORT,41641,Direct,no-resolve

  # --- 规则集镜像站直连 (防死锁) ---
  - DOMAIN-KEYWORD,gh-proxy,Direct
  - DOMAIN-SUFFIX,gh-proxy.com,Direct

  # --- 本地私网直连 ---
  - RULE-SET,private_ip,Direct,no-resolve
  - RULE-SET,private_domain,Direct

  # --- 规则集匹配 (应用与域名分流) ---
  - RULE-SET,ai_domain,Proxy
  - RULE-SET,youtube_domain,Proxy
  - RULE-SET,google_domain,Proxy
  - RULE-SET,github_domain,Proxy
  - RULE-SET,onedrive_domain,Proxy
  - RULE-SET,microsoftcn_domain,Direct
  - RULE-SET,microsoft_domain,Proxy
  - RULE-SET,applecn_domain,Direct
  - RULE-SET,apple_domain,Proxy
  - RULE-SET,telegram_domain,Proxy
  - RULE-SET,tiktok_domain,Proxy
  - RULE-SET,netflix_domain,Proxy
  - RULE-SET,paypal_domain,Proxy
  - RULE-SET,binance_domain,Proxy
  - RULE-SET,okx_domain,Proxy
  - RULE-SET,usd_domain,Proxy
  - RULE-SET,steamcn_domain,Direct
  - RULE-SET,steam_domain,Proxy
  - RULE-SET,cn!_domain,Proxy
  - RULE-SET,google_ip,Proxy
  - RULE-SET,apple_ip,Proxy
  - RULE-SET,telegram_ip,Proxy
  - RULE-SET,netflix_ip,Proxy
  - RULE-SET,cn_ip,Direct

  # --- 兜底策略 ---
  - MATCH,Proxy

