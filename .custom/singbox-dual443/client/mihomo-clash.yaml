    interval: 86400
    behavior: domain
    format: text
    url: REPLACE_WITH_RULESET_PROXY_PREFIXhttps://raw.githubusercontent.com/RolinShmily/sub-rule/refs/heads/main/rules/fakeipfilter-cn.list
  fakeipfilter_!cn:
    type: http
    interval: 86400
    behavior: domain
    format: text
    url: REPLACE_WITH_RULESET_PROXY_PREFIXhttps://raw.githubusercontent.com/RolinShmily/sub-rule/refs/heads/main/rules/fakeipfilter-!cn.list
